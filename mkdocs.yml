site_name: PerturbScape
site_description: >-
  Learn gene programs from Perturb-seq data and map them to the heritability of
  complex diseases and traits.
site_url: https://deylab999mskcc.github.io/perturbscape-docs/
repo_url: https://github.com/Deylab999MSKCC/perturbscape
repo_name: Deylab999MSKCC/perturbscape
edit_uri: https://github.com/Deylab999MSKCC/perturbscape-docs/edit/main/docs/
copyright: Dey Lab, Memorial Sloan Kettering Cancer Center

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-minimal.png
  favicon: assets/logo-minimal.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/circle-half-full
        name: Switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/circle-outline
        name: Switch to dark
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: ps-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - minify:
      minify_html: true

extra_javascript:
  - javascripts/mermaid.js
  - javascripts/explorer.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Deylab999MSKCC
      name: Dey Lab on GitHub
  generator: false

nav:
  - Home: index.md

  - Documentation:
      - docs/index.md
      - Getting Started: docs/getting-started.md
      - Configuration: docs/configuration.md
      - Running the Pipeline: docs/running.md
      - Outputs: docs/outputs.md
      - Methods:
          - docs/methods/index.md
          - Contrastive Embeddings: docs/methods/embeddings.md
          - Gene Programs and Hotspot: docs/methods/gene-programs.md
          - Disease Enrichment: docs/methods/disease-enrichment.md
      - Modules:
          - docs/modules/index.md
          - Linear Contrastive: docs/modules/linear-contrastive.md
          - Kernel Contrastive: docs/modules/kernel-contrastive.md
          - Non-Contrastive Baselines: docs/modules/baselines.md
          - ContrastiveVI: docs/modules/contrastivevi.md
          - DE and DGCA: docs/modules/de-dgca.md
          - Hotspot: docs/modules/hotspot.md
      - Reference:
          - FAQ: docs/faq.md
          - Citation: docs/citation.md

  - Data Portal:
      - data/index.md
      - How to Read the Portal: data/guide.md
      - Datasets: data/datasets.md
      - Schema and Downloads: data/schema.md
